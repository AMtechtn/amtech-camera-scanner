
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>AMTECH Traveler QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      padding: 18px;
      background: #f3f6fa;
      color: #17365d;
      font: 16px Arial, sans-serif;
    }

    .panel {
      max-width: 550px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      background: #17365d;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
    }

    video {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>AMTECH Traveler QR Scanner</h2>

    <p>
      Scan the production traveler QR code
      to populate AMTECH material registration.
    </p>

    <button id="startButton" type="button">
      Scan Production Traveler
    </button>

    <video id="camera" autoplay playsinline muted></video>

    <button id="cancelButton"
            type="button"
            style="display:none">
      Cancel Scan
    </button>

    <div id="status" class="status">
      Ready to scan.
    </div>
    
<div id="activitySelection" style="display:none; margin-top:20px;">

  <h3>Select Production Activity</h3>

  <button id="materialRegistrationButton"
          type="button">
    Material Registration
  </button>

  <button id="productionReportingButton"
          type="button">
    End-of-Shift Production Reporting
  </button>

</div>

  </div>

<script>
const startButton = document.getElementById('startButton');
const cancelButton = document.getElementById('cancelButton');
const camera = document.getElementById('camera');
const statusMessage = document.getElementById('status');

const activitySelection =
  document.getElementById('activitySelection');

const materialRegistrationButton =
  document.getElementById('materialRegistrationButton');

const productionReportingButton =
  document.getElementById('productionReportingButton');


const AMTECH_WEB_APP_URL =
  new URLSearchParams(window.location.search).get('app') || '';
  
const AMTECH_SCAN_MODE =
  new URLSearchParams(window.location.search)
    .get('mode') || 'ttm';


function amtechGetVerifiedDestination() {
  if (!AMTECH_WEB_APP_URL) {
    throw new Error('AMTECH web app destination is not configured.');
  }

  const url = new URL(AMTECH_WEB_APP_URL);

  if (
    url.protocol !== 'https:' ||
    url.hostname !== 'script.google.com' ||
    !/^\/macros\/s\/[^/]+\/(dev|exec)$/.test(url.pathname) ||
    url.search ||
    url.hash
  ) {
    throw new Error('Invalid AMTECH web app destination.');
  }

  return url;
}




let cameraStream = null;

function amtechParseTravelerQR(qrText) {
  const text = String(qrText || '').trim();
  const fields = text.split('|');

  if (fields[0] !== 'AMTECH-PO-V1') {
    throw new Error('Not a valid AMTECH traveler QR code.');
  }

  const data = {};

  fields.slice(1).forEach(function(field) {
    const separator = field.indexOf('=');

    if (separator <= 0) {
      throw new Error('Invalid traveler field.');
    }

    const key = field.slice(0, separator).trim();
    const value = field.slice(separator + 1).trim();

    if (!key || !value ||
        Object.prototype.hasOwnProperty.call(data, key)) {
      throw new Error('Invalid or duplicate traveler field.');
    }

    if (!['PO', 'CUSTOMER', 'PART', 'QTY'].includes(key)) {
      throw new Error('Unexpected traveler field: ' + key);
    }

    data[key] = value;
  });

  if (!data.PO || !data.CUSTOMER || !data.PART) {
    throw new Error('Traveler information is incomplete.');
  }

  if (data.QTY !== undefined &&
      (!/^[1-9]\d*$/.test(data.QTY) ||
       !Number.isSafeInteger(Number(data.QTY)))) {
    throw new Error('Invalid production order quantity.');
  }

  return data;
}

let scanFrameId = null;
let qrDetected = false;

const scanCanvas = document.createElement('canvas');
const scanContext = scanCanvas.getContext('2d', {
  willReadFrequently: true
});

function amtechOpenTravelerVerification(qrText) {
  const traveler = amtechParseTravelerQR(qrText);
  const url = amtechGetVerifiedDestination();

  url.searchParams.set('page', 'traveler-verification');
  url.searchParams.set('traveler', qrText.trim());

  window.location.assign(url.toString());
}

function scanCameraFrame() {
  if (!cameraStream || qrDetected) return;

  if (camera.readyState >= 2 &&
      camera.videoWidth > 0 &&
      camera.videoHeight > 0) {

    scanCanvas.width = camera.videoWidth;
    scanCanvas.height = camera.videoHeight;

    scanContext.drawImage(
      camera, 0, 0,
      scanCanvas.width, scanCanvas.height
    );

    const image = scanContext.getImageData(
      0, 0, scanCanvas.width, scanCanvas.height
    );

    const result = jsQR(
      image.data,
      image.width,
      image.height,
      { inversionAttempts: 'dontInvert' }
    );

    
if (result && result.data) {
  try {
    const traveler = amtechParseTravelerQR(result.data);

    qrDetected = true;
    stopCamera();

    
statusMessage.textContent =
  'AMTECH traveler recognized: ' +
  traveler.PO +
  ' | Customer: ' + traveler.CUSTOMER +
  ' | Part: ' + traveler.PART +
  ' | Order Quantity: ' + (traveler.QTY || 'Not provided');


    
activitySelection.style.display = 'block';

materialRegistrationButton.disabled = true;
productionReportingButton.disabled = true;
statusMessage.classList.remove('error');
   
amtechOpenTravelerVerification(result.data);
 return;

  } catch (error) {
    qrDetected = true;
    stopCamera();

    statusMessage.textContent =
      'QR rejected: ' + error.message;

    statusMessage.classList.add('error');
    return;
  }
}

  }

  scanFrameId = requestAnimationFrame(scanCameraFrame);
}

async function startCamera() {
  
activitySelection.style.display = 'none';
materialRegistrationButton.disabled = true;
productionReportingButton.disabled = true;

try {
  amtechGetVerifiedDestination();
} catch (error) {
  statusMessage.textContent = error.message;
  statusMessage.classList.add('error');
  return;
}

  startButton.disabled = true;
  statusMessage.textContent = 'Opening camera...';
  statusMessage.classList.remove('error');

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' }
      }
    });

    camera.srcObject = cameraStream;
    camera.style.display = 'block';
    cancelButton.style.display = 'block';

    await camera.play();
qrDetected = false;
scanFrameId = requestAnimationFrame(scanCameraFrame);
    statusMessage.textContent =
      'Camera ready — point at the traveler QR code.';

  } catch (error) {
    stopCamera();
    statusMessage.textContent =
      'Unable to open camera: ' + error.message;
    statusMessage.classList.add('error');
  } finally {
    startButton.disabled = false;
  }
}


function stopCamera() {
  if (scanFrameId !== null) {

  cancelAnimationFrame(scanFrameId);
  scanFrameId = null;
}
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(track) {
      track.stop();
    });
    cameraStream = null;
  }

  camera.pause();
  camera.srcObject = null;
  camera.style.display = 'none';
  cancelButton.style.display = 'none';
}

startButton.addEventListener('click', startCamera);

cancelButton.addEventListener('click', function() {
  stopCamera();
  statusMessage.textContent = 'Camera scanning stopped.';
});

window.addEventListener('pagehide', stopCamera);
</script>

</body>
</html>
